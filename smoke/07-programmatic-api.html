<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>07 — Programmatic ModuleTSX API</title>
    <link rel="stylesheet" href="https://raw.esm.sh/qunit/qunit/qunit.css" />
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script src="https://raw.esm.sh/qunit/qunit/qunit.js"></script>
    <script type="module">
      import { ModuleTSX } from "../dist/index.mjs";

      const { test } = QUnit;

      QUnit.module("Programmatic ModuleTSX API", () => {
        test("emits 'import' event on m.import()", async (assert) => {
          const m = new ModuleTSX({
            baseUrl: location.href,
            fetch: async () => { throw new Error("stop"); },
          });
          const ids = [];
          m.addEventListener("import", (e) => ids.push(e.detail.id));
          m.addEventListener("import:error", () => {});
          await m.import("react").catch(() => {});
          assert.ok(ids.includes("react"), "import event fired with specifier");
        });

        test("emits 'import:error' when fetch fails", async (assert) => {
          const m = new ModuleTSX({
            baseUrl: location.href,
            fetch: async () => { throw new Error("network down"); },
          });
          let errorId;
          m.addEventListener("import:error", (e) => { errorId = e.detail.id; });
          await m.import("react").catch(() => {});
          assert.strictEqual(errorId, "https://esm.sh/react", "error fired with resolved URL");
        });

        test("emits 'transform' event on importCode()", async (assert) => {
          const m = new ModuleTSX({ baseUrl: location.href });
          const urls = [];
          m.addEventListener("transform", (e) => urls.push(e.detail.sourceUrl));
          await m.importCode("https://example.com/x.ts", `export const x = 1;`);
          assert.ok(urls.includes("https://example.com/x.ts"), "transform event fired with sourceUrl");
        });

        test("emits '*' wildcard event for all events", async (assert) => {
          const m = new ModuleTSX({ baseUrl: location.href });
          const types = [];
          m.addEventListener("*", (e) => types.push(e.detail.type));
          await m.importCode("https://example.com/y.ts", `export const y = 2;`);
          assert.ok(types.includes("transform"), "wildcard emits transform");
        });

        test("custom resolveBareSpecifier function is called", async (assert) => {
          let called = false;
          const m = new ModuleTSX({
            baseUrl: location.href,
            fetch: async () => { throw new Error("stop"); },
            resolveBareSpecifier: (s) => { called = true; return `https://cdn.example/${s}`; },
          });
          m.addEventListener("import:error", () => {});
          await m.import("vue").catch(() => {});
          assert.true(called, "custom resolveBareSpecifier was called");
        });
      });
    </script>
  </body>
</html>
